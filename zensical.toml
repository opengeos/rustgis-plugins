[project]
site_name = "RustGIS Plugins"
site_description = "Plugins for RustGIS: sandboxed WebAssembly modules that add commands and geoprocessing tools"
site_author = "opengeos"
site_url = "https://plugins.rustgis.app"
repo_url = "https://github.com/opengeos/rustgis-plugins"
repo_name = "opengeos/rustgis-plugins"
copyright = "Copyright &copy; 2026 Qiusheng Wu"

nav = [
  { "Home" = "index.md" },
  { "Catalog" = "catalog.md" },
  { "Write a Plugin" = "develop.md" },
  { "Publish a Plugin" = "registry.md" },
  { "RustGIS" = "https://rustgis.app" },
  { "Web App" = "https://web.rustgis.app" },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/catalog.js"]

[project.theme]
logo = "https://assets.rustgis.app/images/logo.svg"
favicon = "https://assets.rustgis.app/images/favicon.png"
features = ["content.code.copy", "navigation.footer", "navigation.instant", "navigation.top", "search.highlight"]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "deep orange"
accent = "indigo"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "deep orange"
accent = "indigo"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.toc]
permalink = true
