name: Nightly

# Every published package, in the latest RustGIS: a change in RustGIS that breaks a plugin shows
# up here, not when someone next touches that plugin. GitHub emails a failed scheduled run to
# whoever last changed this schedule.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

# It runs process plugins, which aren't sandboxed: a read-only token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs every fourth plugin; raise it as the registry grows.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Caches are saved before any plugin runs, never after: a process plugin isn't sandboxed,
      # and a cache it changed would be restored by later runs, pull requests' included.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # With the published index this builds nothing; it writes dist/registry.json to test.
      - name: Read the registry
        run: python scripts/build.py --check
      - name: RustGIS commit to test against
        id: rustgis
        run: echo "sha=$(git ls-remote https://github.com/opengeos/RustGIS main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cli
        with:
          path: ~/rustgis-cli
          key: rustgis-cli-${{ runner.os }}-${{ steps.rustgis.outputs.sha }}
      - name: Build rustgis-cli
        if: steps.cli.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/opengeos/RustGIS --rev "${{ steps.rustgis.outputs.sha }}" rustgis-cli --root ~/rustgis-cli-root
          mkdir -p ~/rustgis-cli && cp ~/rustgis-cli-root/bin/rustgis-cli ~/rustgis-cli/
      - uses: actions/cache/save@v4
        if: steps.cli.outputs.cache-hit != 'true'
        with:
          path: ~/rustgis-cli
          key: rustgis-cli-${{ runner.os }}-${{ steps.rustgis.outputs.sha }}
      - name: Run every published plugin in RustGIS
        run: python scripts/smoke.py --all --shard ${{ matrix.shard }}/4 --cli ~/rustgis-cli/rustgis-cli
