name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The RustGIS the smoke test runs plugins in (a branch or tag of opengeos/RustGIS).
  RUSTGIS_REF: ${{ vars.RUSTGIS_REF || 'main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  registry:
    name: Build and check the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Only plugins whose version (or source) changed are built and run; the rest are reused
      # from packages.rustgis.app.
      - name: Build, package and check the plugins that changed
        run: python scripts/build.py --check
      # The pull request's packages, for plugin-preview.yml to publish (it holds the secrets and
      # runs none of this code). Before the smoke test, so a failing plugin can still be tried.
      - name: Make the preview
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/preview.py dist preview
          printf '{"pr": %s, "sha": "%s"}\n' "$PR" "$HEAD_SHA" > preview/pr.json
      - name: Upload the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-preview
          path: preview
          retention-days: 3
      - name: RustGIS commit to test against
        id: rustgis
        run: echo "sha=$(git ls-remote https://github.com/opengeos/RustGIS "$RUSTGIS_REF" | cut -f1 | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cli
        with:
          path: ~/rustgis-cli
          key: rustgis-cli-${{ runner.os }}-${{ steps.rustgis.outputs.sha }}
      - name: Build rustgis-cli
        if: steps.cli.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/opengeos/RustGIS --rev "${{ steps.rustgis.outputs.sha }}" rustgis-cli --root ~/rustgis-cli-root
          mkdir -p ~/rustgis-cli && cp ~/rustgis-cli-root/bin/rustgis-cli ~/rustgis-cli/
      - name: Run the changed plugins in RustGIS
        run: python scripts/smoke.py --cli ~/rustgis-cli/rustgis-cli
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: dist/
