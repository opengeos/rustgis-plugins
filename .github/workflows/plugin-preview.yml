# Publishes each pull request's plugins to Cloudflare Pages, so reviewers can install them in
# https://web.rustgis.app before they are merged:
#
#   https://pr-<N>.rustgis-plugins-preview.pages.dev  ->  "Open in RustGIS"
#   = https://web.rustgis.app/?registry=https://pr-<N>.rustgis-plugins-preview.pages.dev/registry.json
#
# The preview's registry lists every plugin, with the pull request's new packages served from
# the preview itself. A sticky comment carries the link; the preview is deleted when the pull
# request closes.
#
# HOW IT STAYS SAFE
# CI (ci.yml) builds the pull request's plugins with no secrets and uploads the result as the
# `plugin-preview` artifact. This workflow runs the base branch's code only (workflow_run and
# pull_request_target always do), holds the Cloudflare token, and never checks out or runs the
# pull request: from the artifact it takes registry.json and .rgplugin packages alone, checked
# by scripts/preview.py --site, which writes the landing page and headers itself. The artifact's
# pull request number is trusted only once that pull request's head is the commit CI built.
# So fork pull requests, the usual way plugins arrive, get previews too.
#
# The actions are pinned to commit SHAs: they run beside the Cloudflare token or with
# pull-requests: write, so a moved tag must not hand either to code nobody reviewed.
#
# SETUP (one time)
#   CLOUDFLARE_PAGES_TOKEN - an API token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  - already set for the package bucket
# The Pages project `rustgis-plugins-preview` exists already. Without the token, previews are
# skipped with a notice.
name: Plugin preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  PROJECT: rustgis-plugins-preview

# Publishing and removing a pull request's preview share one concurrency group per pull request
# (plugin-preview-pr-<N>) and never cancel each other, so they run one after the other: a
# removal can't be overtaken by a publish that was already under way. Only `resolve` can tell
# which pull request a CI run belongs to, so publishing is a job of its own.
jobs:
  resolve:
    name: Build the preview site
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.repository == 'opengeos/rustgis-plugins'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-preview-run-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    outputs:
      number: ${{ steps.pr.outputs.number }}
      plugins: ${{ steps.site.outputs.plugins }}
    steps:
      # The base branch: its scripts/preview.py, not the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the preview from the CI run
        id: fetch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: plugin-preview
          path: preview-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Find the pull request
        id: pr
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(jq -r '.pr' preview-data/pr.json)
          if ! [[ "$pr" =~ ^[0-9]{1,7}$ ]]; then
            echo "::error::The preview names no pull request."
            exit 1
          fi
          # Trust the number only if that pull request's head is the commit CI built (and it's
          # still open): fork runs don't say which pull request they belong to.
          read -r head state < <(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '"\(.head.sha) \(.state)"')
          if [ "$head" != "$RUN_SHA" ] || [ "$state" != open ]; then
            echo "::notice::#$pr has moved on from $RUN_SHA (or is closed); a later run publishes it."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Build the site
        id: site
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The other plugins are listed as published, not as the artifact says.
          curl -sf --retry 3 https://plugins.rustgis.app/registry.json -o published.json
          python3 scripts/preview.py --site preview-data "$PR" "$RUN_SHA" site --published published.json
          echo "plugins=$(find site/packages -name '*.rgplugin' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Hand the site to the publish job
        if: steps.site.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: site
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Publish the preview
    needs: resolve
    # Only pull requests that build a plugin package get a preview.
    if: needs.resolve.outputs.plugins != '' && needs.resolve.outputs.plugins != '0'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-preview-pr-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN != '' }}
    steps:
      - name: Say why there is no preview
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_PAGES_TOKEN is not set, so the preview isn't published."

      - name: Fetch the site
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: site

      # The pull request may have closed (and its preview been removed) while the site was
      # built: check again just before publishing.
      - name: Check the pull request is still open
        id: open
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          read -r head state < <(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '"\(.head.sha) \(.state)"')
          if [ "$head" = "$RUN_SHA" ] && [ "$state" = open ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::#$PR closed or moved on while the preview was built; not publishing."
          fi

      - name: Create a scratch directory for wrangler
        if: steps.open.outputs.ok == 'true'
        run: mkdir -p .wrangler-deploy

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.open.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .wrangler-deploy
          command: >-
            pages deploy ${{ github.workspace }}/site
            --project-name=${{ env.PROJECT }}
            --branch=pr-${{ needs.resolve.outputs.number }}
            --commit-hash=${{ github.event.workflow_run.head_sha }}
            --commit-dirty=true

      - name: Comment the preview on the pull request
        if: steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.resolve.outputs.number }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PLUGINS: ${{ needs.resolve.outputs.plugins }}
        with:
          script: |
            const marker = '<!-- plugin-preview -->';
            const site = process.env.ALIAS_URL || process.env.DEPLOY_URL;
            const registry = `${site}/registry.json`;
            const open = `https://web.rustgis.app/?registry=${encodeURIComponent(registry)}`;
            const n = Number(process.env.PLUGINS);
            const body = [
              marker,
              '### 🧩 Plugin preview',
              '',
              `**[Open in RustGIS](${open})**: web.rustgis.app's Plugin Manager on this pull request's registry (${n} plugin package${n === 1 ? '' : 's'} from this pull request). Install from **Browse**; RustGIS shows the permissions first.`,
              '',
              '| Item | Value |',
              '| --- | --- |',
              `| Preview | ${site} |`,
              `| Registry (desktop: Plugin Manager › Settings) | ${registry} |`,
              `| This commit | ${process.env.DEPLOY_URL} |`,
              `| Commit | \`${process.env.HEAD_SHA.slice(0, 7)}\` |`,
              '',
              '_Unreviewed code: install it only to review this pull request._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  remove:
    name: Remove the preview
    if: github.event_name == 'pull_request_target' && github.repository == 'opengeos/rustgis-plugins'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN != '' }}
    steps:
      # Deletes the pull request's deployments. Nothing from the pull request is checked out.
      - name: Delete the deployments
        if: env.HAS_TOKEN == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$PROJECT/deployments"
          ids=""
          page=1
          while :; do
            if ! got=$(curl -sf --retry 3 -H "Authorization: Bearer $CF_TOKEN" "$api?per_page=25&page=$page&env=preview"); then
              echo "::warning::Could not list $BRANCH's deployments (page $page); some may remain."
              break
            fi
            [ "$(jq '.result | length' <<< "$got")" -gt 0 ] || break
            ids+=" $(jq -r --arg b "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<< "$got")"
            page=$((page + 1))
            if [ "$page" -gt 400 ]; then
              echo "::warning::Stopped after 10,000 deployments; some of $BRANCH's may remain."
              break
            fi
          done
          for id in $ids; do
            if curl -sf --retry 3 -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$api/$id?force=true" > /dev/null; then
              echo "deleted $id"
            else
              echo "::warning::Could not delete deployment $id of $BRANCH."
            fi
          done

      - name: Mark the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- plugin-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id,
                body: `${marker}\n### 🧩 Plugin preview\n\nRemoved: the pull request is closed.` });
            }
