name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Build the registry
        run: python3 scripts/build.py --check
      - name: Build the site
        run: |
          python3 scripts/generate_catalog.py
          uv venv --python 3.12
          uv pip install -r requirements.txt
          .venv/bin/zensical build
          cp dist/registry.json dist/blocklist.json site/
          cp -r dist/packages site/packages
          cp CNAME site/CNAME
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
