[package]
name = "basemaps"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A plugin is a WebAssembly module: build it with
#   cargo build --release --target wasm32-unknown-unknown -p basemaps
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustgis-plugin = { workspace = true }
